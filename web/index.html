<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mix_final_ACTUAL.wav</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header id="transport">
  <h1 id="title" title="Click: recent projects. Double-click: rename the project">mix_final_ACTUAL.wav</h1>
  <div id="recentMenu" class="menu" hidden></div>
  <div class="grp">
    <button class="tbtn" id="toStart" title="Go to start of cycle (Return)"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
    <button class="tbtn" id="play" title="Play / stop (Space)"><svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg></button>
    <button class="tbtn" id="cycle" title="Cycle: loop the region (C)"><svg viewBox="0 0 16 16"><path d="M4 5h7V3l4 3.5L11 10V8H4v3H2V7a2 2 0 0 1 2-2zm8 6H5v2l-4-3.5L5 6v2h7V5h2v4a2 2 0 0 1-2 2z"/></svg></button>
  </div>
  <div id="clock" title="Click: switch between bars and minutes">0:00.0 <small>/ 0:00.0</small></div>
  <div id="tempoBox" title="Tempo and grid. Click the BPM to type it; T taps it">
    <span id="bpm">120.0</span><small>BPM</small> <span id="sig">4/4</span>
    <button id="snapBtn" title="Snap clips to the grid (Q)">Snap</button>
    <select id="gridSel" title="Grid size"><option value="bar">bar</option><option value="beat" selected>beat</option><option value="0.5">1/8</option><option value="0.25">1/16</option></select>
  </div>
  <div class="sep"></div>
  <div id="loudBox" title="Loudness of playback and of the export: both use the same master gain, so you hear what you export">
    Loudness
    <select id="loud"><option value="">as mixed</option><option value="-16">-16 LUFS</option><option value="-14">-14 LUFS (streaming)</option><option value="-9">-9 LUFS (loud)</option></select>
    <span id="loudGain"></span>
  </div>
  <button id="ab" title="A/B: hear the raw tracks (level-matched) against your mix (A)">A/B</button>
  <div class="sep"></div>
  <div id="viewSwitch"><button id="vTracks" class="on" title="Tracks (X)">Tracks</button><button id="vMixer" title="Mixer (X)">Mixer</button></div>
  <button id="exportBtn" title="Export the mix (Cmd/Ctrl+B)">Export…</button>
  <span class="spacer"></span>
  <span id="agentPill" title="Your coding agent"><i></i><span>no agent</span></span>
  <button id="helpBtn" class="tbtn" title="Keyboard shortcuts (?)">?</button>
</header>
<div id="main">
  <aside id="inspector"><div class="empty">Select a track to see its controls.</div></aside>
  <section id="center">
    <div id="arrange">
      <div id="corner"><span>Tracks</span><span class="spacer"></span><button id="hMinus" title="Smaller tracks">▾</button><button id="hPlus" title="Taller tracks">▴</button></div>
      <div id="rulerWrap" title="Click: move the playhead. Drag: set the cycle (what loops, and what the agent listens to)."><canvas id="ruler"></canvas></div>
      <div id="headers"><div id="headersIn"></div></div>
      <div id="lanesWrap"><canvas id="lanes"></canvas><canvas id="overlay"></canvas></div>
      <div id="hcorner"></div>
      <div id="hbar"><i></i></div>
    </div>
    <div id="mixer" hidden></div>
  </section>
  <aside id="assistant">
    <div class="hd">Assistant <span class="spacer"></span><span id="agentState" style="font-weight:400;color:var(--dim);font-size:11px"></span></div>
    <div id="log"></div>
    <div id="ask">
      <div id="rangeHint" class="rangehint"></div>
      <textarea id="prompt" placeholder="Ask for a change: 'vocals more upfront, less reverb on the drums'"></textarea>
      <div class="rowb">
        <button id="askBtn" class="primary" title="Send to your coding agent (Enter)">Ask</button>
        <span class="spacer"></span>
      </div>
    </div>
  </aside>
</div>

<div id="exportDlg" class="modal" hidden>
  <div class="dlg">
    <h2>Export the mix</h2>
    <div class="f"><label>Save as</label><div class="path"><input type="text" id="exPath" spellcheck="false"><button id="exChoose">Choose…</button></div></div>
    <div class="f"><label>Format</label><select id="exFormat"><option value="wav">WAV, 24-bit</option><option value="flac">FLAC, 24-bit</option></select></div>
    <div class="f"><label>Loudness</label><select id="exLoud"><option value="">as mixed</option><option value="-16">-16 LUFS</option><option value="-14">-14 LUFS (streaming)</option><option value="-9">-9 LUFS (loud)</option></select></div>
    <div class="f"><label>Stems</label><label style="color:var(--fg)"><input type="checkbox" id="exStems"> also one file per track, in a folder next to the mix</label></div>
    <div class="bar" id="exBarWrap" hidden><i id="exBar"></i></div>
    <div class="acts"><span class="st" id="exState"></span><button id="exReveal" hidden>Show in folder</button><button id="exCancel">Close</button><button id="exGo" class="on">Export</button></div>
  </div>
</div>

<div id="keysDlg" class="modal" hidden>
  <div class="dlg"><h2>Keyboard shortcuts</h2><div class="keys" id="keysList"></div><div class="acts"><button id="keysClose">Close</button></div></div>
</div>

<div id="toast" hidden></div>
<div id="valTip" hidden></div>
<div id="wait" hidden>
  <h2>Making the first mix</h2>
  <div class="bar"><i id="waitBar"></i></div>
  <p id="waitText">Starting...</p>
  <button id="skip" title="Open the mixer now and mix by hand (your agent can still help later)">Mix by hand instead</button>
</div>
<script src="/app.js"></script>
</body>
</html>
